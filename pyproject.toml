[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sealbox"
version = "0.1.0"
description = "Compute-to-data MCP server: let cloud AI agents reason ABOUT sensitive data without the raw data leaving."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
keywords = ["mcp", "privacy", "data-governance", "llm", "agents", "security", "compute-to-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.10",
  "duckdb>=1.1",
  "cryptography>=42",
  "pyyaml>=6",
  "fsspec>=2023.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
pandas = ["pandas>=2"]
injectguard = ["injectguard>=0.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "pyarrow>=14"]

[project.scripts]
sealbox = "sealbox.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/sealbox"

[tool.hatch.build.targets.wheel]
packages = ["src/sealbox"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "S608", "RUF001", "RUF012", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"redteam/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src/sealbox"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "injectguard.*", "mcp.*", "fsspec.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: spawns subprocess MCP servers"]

[tool.coverage.run]
source = ["sealbox"]
branch = true
omit = ["*/sealbox/_runner.py"]  # runs only inside the sandbox subprocess; exercised by tests/test_sandbox.py

[[tool.mypy.overrides]]
module = ["sealbox.server"]
disallow_untyped_decorators = false
