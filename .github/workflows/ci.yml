# Manual only: run from the Actions tab ("Run workflow"). No push/PR triggers on purpose.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q --cov=sealbox --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sealbox:ci .
      - name: Smoke test (vault + MCP handshake, no network)
        run: |
          set -euo pipefail
          export SEALBOX_MASTER_KEY=$(python3 -c "import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          mkdir -p vault && chmod 777 vault
          RUN="docker run --rm -i --network none -e SEALBOX_MASTER_KEY -v $PWD/vault:/vault -v $PWD/examples/demo_data:/demo:ro sealbox:ci"
          $RUN --version
          $RUN init
          $RUN ingest /demo/sales.csv /demo/employees.csv
          $RUN ingest /demo/acme_engine --name acme_engine
          $RUN datasets
          pip install -q mcp
          python3 - <<'PY'
          import asyncio, os
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          cmd = ["run", "--rm", "-i", "--network", "none", "-e", "SEALBOX_MASTER_KEY",
                 "-v", f"{os.getcwd()}/vault:/vault", "sealbox:ci", "serve"]
          async def main():
              p = StdioServerParameters(command="docker", args=cmd, env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      tools = [t.name for t in (await s.list_tools()).tools]
                      print("tools:", tools)
                      assert "detokenize" not in tools and "run_sql" in tools
                      res = await s.call_tool("list_datasets", {})
                      print(res.content[0].text[:500])
          asyncio.run(main())
          PY
          $RUN audit verify
